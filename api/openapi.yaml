openapi: 3.1.0
info:
  title: Ledger API
  version: 0.1.0
  summary: Double-entry wallet and payments engine.
  description: |
    Wallets and idempotent P2P transfers on an immutable double-entry ledger.
    Simulated money only.

    **Amounts** are integers in minor units, sent with a `currency` field.
    COP has 2 decimals, so $50,000 COP is `5000000`. The maximum amount is
    `9007199254740991` (2^53 - 1), the largest integer every JSON client reads
    exactly.

    **Errors** use RFC 9457 `application/problem+json`. Branch on `code`, never
    on `title` or `detail`.

    **Authentication:** every request sends an API key as a Bearer token. In
    v0.1 keys are static configuration; managed keys arrive in phase 3.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Accounts
    description: Wallets, their balances and their history.
  - name: Transfers
    description: P2P money movement between wallets.
security:
  - apiKey: []
paths:
  /v1/accounts:
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Create a wallet
      description: Creates a user or merchant wallet with a zero balance. System accounts cannot be created through the API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            examples:
              user:
                summary: User wallet
                value:
                  kind: user
                  owner_id: 0192f0c1-7a00-7000-8000-0000000000a1
                  alias: ana
                  currency: COP
      responses:
        '201':
          description: Wallet created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                created:
                  $ref: '#/components/examples/AccountAna'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The alias is taken, or the owner already has a wallet in this currency.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                accountExists:
                  value:
                    type: /problems/account_exists
                    title: Account already exists
                    status: 409
                    detail: The alias 'ana' is already taken.
                    code: account_exists
  /v1/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: Get a wallet
      description: Returns a wallet and its status.
      responses:
        '200':
          description: The wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                active:
                  $ref: '#/components/examples/AccountAna'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/accounts/{id}/balance:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Get a wallet's balance
      description: Returns the available and locked balance. `total` is always `available + locked`.
      responses:
        '200':
          description: The balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
              examples:
                withLockedFunds:
                  summary: Balance with funds reserved
                  value:
                    account_id: 0192f0c1-7a10-7000-8000-000000000001
                    currency: COP
                    available: 7000000
                    locked: 3000000
                    total: 10000000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/accounts/{id}/postings:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: listAccountPostings
      summary: List a wallet's history
      description: Returns the wallet's postings, newest first. Pass `next_cursor` back as `cursor` to read the next page.
      parameters:
        - name: cursor
          in: query
          description: Opaque value from a previous page's `next_cursor`.
          schema:
            type: string
          example: eyJzZXEiOjQxfQ
        - name: limit
          in: query
          description: Maximum number of postings to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: One page of postings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingPage'
              examples:
                lastPage:
                  summary: A page with nothing after it
                  value:
                    data:
                      - id: 0192f0c1-7b20-7000-8000-000000000002
                        transaction_id: 0192f0c1-7b10-7000-8000-000000000001
                        account_id: 0192f0c1-7a10-7000-8000-000000000001
                        amount: -5000000
                        currency: COP
                        seq: 2
                        balance_before: 10000000
                        balance_after: 5000000
                        created_at: '2026-11-01T15:04:05Z'
                      - id: 0192f0c1-7b00-7000-8000-000000000003
                        transaction_id: 0192f0c1-7af0-7000-8000-000000000004
                        account_id: 0192f0c1-7a10-7000-8000-000000000001
                        amount: 10000000
                        currency: COP
                        seq: 1
                        balance_before: 0
                        balance_after: 10000000
                        created_at: '2026-11-01T14:00:00Z'
                    next_cursor: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Create a P2P transfer
      description: |
        Moves money from a wallet to the wallet behind an alias.

        **Retries are safe.** Resending the same request with the same
        `Idempotency-Key` for 24 hours returns the original response, including
        the original error, with `Idempotent-Replayed: true`, and moves no money.

        `reference` is a second defense: unique per client with no expiry. A
        failed transfer keeps its reference, so a new attempt needs a new one.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique per client and valid for 24 hours. Reusing it with a different body returns `idempotency_key_reused`.
          schema:
            type: string
            minLength: 1
            maxLength: 255
          example: 7f3c1b52-2a4e-4c8e-9d11-5b6f0a3e1c44
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
            examples:
              p2p:
                summary: Ana sends $50,000 COP to Beto
                value:
                  from_account_id: 0192f0c1-7a10-7000-8000-000000000001
                  to_alias: beto
                  amount: 5000000
                  currency: COP
                  reference: order-1001
      responses:
        '201':
          description: Transfer completed, or the replay of one.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              examples:
                completed:
                  $ref: '#/components/examples/TransferCompleted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The wallet is frozen, or the reference was already used.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                accountFrozen:
                  summary: A wallet in the transfer is frozen
                  value:
                    type: /problems/account_frozen
                    title: Account frozen
                    status: 409
                    detail: The source account cannot move money.
                    code: account_frozen
                    transfer_id: 0192f0c1-7c00-7000-8000-000000000005
                duplicateReference:
                  summary: The reference belongs to an earlier transfer
                  value:
                    type: /problems/duplicate_reference
                    title: Duplicate reference
                    status: 409
                    detail: The reference 'order-1001' was already used.
                    code: duplicate_reference
        '422':
          description: The request is valid but cannot be carried out.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                insufficientFunds:
                  summary: The available balance is too low
                  value:
                    type: /problems/insufficient_funds
                    title: Insufficient funds
                    status: 422
                    detail: The source account has less than the requested amount available.
                    code: insufficient_funds
                    transfer_id: 0192f0c1-7c00-7000-8000-000000000005
                sameAccount:
                  summary: Source and destination are the same wallet
                  value:
                    type: /problems/same_account
                    title: Same account
                    status: 422
                    detail: Source and destination must be different accounts.
                    code: same_account
                idempotencyKeyReused:
                  summary: The key was used with a different body
                  value:
                    type: /problems/idempotency_key_reused
                    title: Idempotency key reused
                    status: 422
                    detail: This key was already used with a different request body.
                    code: idempotency_key_reused
  /v1/transfers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Transfer ID.
        schema:
          type: string
          format: uuid
        example: 0192f0c1-7c10-7000-8000-000000000006
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Get a transfer
      description: Returns a transfer and its status. A failed transfer includes its `failure_code`.
      responses:
        '200':
          description: The transfer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
              examples:
                completed:
                  $ref: '#/components/examples/TransferCompleted'
                failed:
                  summary: Failed for lack of funds
                  value:
                    id: 0192f0c1-7c00-7000-8000-000000000005
                    status: failed
                    from_account_id: 0192f0c1-7a10-7000-8000-000000000001
                    to_account_id: 0192f0c1-7a20-7000-8000-000000000002
                    amount: 5000000
                    currency: COP
                    reference: order-1002
                    failure_code: insufficient_funds
                    created_at: '2026-11-01T15:04:05Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: API key. It also identifies the client that scopes idempotency keys and references.
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      description: Account ID.
      schema:
        type: string
        format: uuid
      example: 0192f0c1-7a10-7000-8000-000000000001
  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    IdempotentReplayed:
      description: Present and `true` when this is the stored response of an earlier request.
      schema:
        type: boolean
  responses:
    ValidationError:
      description: The request is malformed or a field is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationError:
              value:
                type: /problems/validation_error
                title: Validation error
                status: 400
                detail: The field 'amount' must be greater than 0.
                code: validation_error
    Unauthorized:
      description: The API key is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              value:
                type: /problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Send a valid API key as a Bearer token.
                code: unauthorized
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              value:
                type: /problems/not_found
                title: Not found
                status: 404
                detail: The account was not found.
                code: not_found
  examples:
    AccountAna:
      summary: An active user wallet
      value:
        id: 0192f0c1-7a10-7000-8000-000000000001
        kind: user
        status: active
        owner_id: 0192f0c1-7a00-7000-8000-0000000000a1
        alias: ana
        currency: COP
        created_at: '2026-11-01T14:00:00Z'
    TransferCompleted:
      summary: A completed transfer
      value:
        id: 0192f0c1-7c10-7000-8000-000000000006
        status: completed
        from_account_id: 0192f0c1-7a10-7000-8000-000000000001
        to_account_id: 0192f0c1-7a20-7000-8000-000000000002
        amount: 5000000
        currency: COP
        reference: order-1001
        failure_code: null
        created_at: '2026-11-01T15:04:05Z'
  schemas:
    Currency:
      type: string
      description: ISO 4217 code. Only COP is supported in v0.1.
      enum: [COP]
    Amount:
      type: integer
      format: int64
      description: Positive amount in minor units.
      minimum: 1
      maximum: 9007199254740991
    SignedAmount:
      type: integer
      format: int64
      description: Signed amount in minor units. Positive adds to the balance and negative reduces it.
      minimum: -9007199254740991
      maximum: 9007199254740991
    Account:
      type: object
      required: [id, kind, status, owner_id, alias, currency, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [user, merchant]
        status:
          type: string
          enum: [active, frozen, closed]
        owner_id:
          type: string
          format: uuid
        alias:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        created_at:
          type: string
          format: date-time
    CreateAccountRequest:
      type: object
      required: [kind, owner_id, alias, currency]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [user, merchant]
        owner_id:
          type: string
          format: uuid
        alias:
          type: string
          description: Public handle used to receive transfers.
          pattern: '^[a-z0-9_.-]{3,32}$'
        currency:
          $ref: '#/components/schemas/Currency'
    Balance:
      type: object
      required: [account_id, currency, available, locked, total]
      properties:
        account_id:
          type: string
          format: uuid
        currency:
          $ref: '#/components/schemas/Currency'
        available:
          type: integer
          format: int64
          description: Money that can be spent now, in minor units.
        locked:
          type: integer
          format: int64
          description: Money reserved by holds, in minor units. Always 0 in v0.1.
        total:
          type: integer
          format: int64
          description: '`available + locked`, in minor units.'
    Posting:
      type: object
      required: [id, transaction_id, account_id, amount, currency, seq, balance_before, balance_after, created_at]
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/SignedAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        seq:
          type: integer
          format: int64
          description: Position in this account's history. Starts at 1 with no gaps.
        balance_before:
          type: integer
          format: int64
        balance_after:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    PostingPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Posting'
        next_cursor:
          type: [string, 'null']
          description: Cursor for the next page, or null on the last page.
    CreateTransferRequest:
      type: object
      required: [from_account_id, to_alias, amount, currency, reference]
      additionalProperties: false
      properties:
        from_account_id:
          type: string
          format: uuid
        to_alias:
          type: string
          description: Alias of the destination wallet.
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        reference:
          type: string
          description: Your identifier for this transfer. Unique per client, with no expiry.
          minLength: 1
          maxLength: 128
    Transfer:
      type: object
      required: [id, status, from_account_id, to_account_id, amount, currency, reference, failure_code, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, pending, completed, failed, reversed]
        from_account_id:
          type: string
          format: uuid
        to_account_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        reference:
          type: string
        failure_code:
          type: [string, 'null']
          description: Why the transfer failed, or null if it did not.
          enum: [insufficient_funds, account_frozen, null]
        created_at:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 problem details with a stable machine-readable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - not_found
            - account_exists
            - insufficient_funds
            - account_frozen
            - same_account
            - idempotency_key_reused
            - duplicate_reference
        transfer_id:
          type: string
          format: uuid
          description: The transfer recorded as failed, when there is one.
